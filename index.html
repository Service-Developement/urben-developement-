function homePage(){const r=R(),visible=db.cases.filter(inScope),mine=visible.filter(x=>x.dept===r.dept),pending=visible.filter(x=>r.type==='director'?x.status==='بانتظار قرار المدير':r.type==='head'?x.status==='قيد المراجعة':x.status==='قيد المعالجة الفنية');return `<section class="banner"><span class="pill">مساحة العمل — ${r.name}</span><h1 class="h1">الرئيسية</h1><p class="lead">${r.type==='director'?'إدارة الخطة والمؤشرات وأعمال القسمين، ومراجعة القرارات والمخرجات الاستراتيجية.':r.type==='head'?'متابعة ملفات القسم ومراجعة المخرجات وتوزيع أعمال الدراسة.':'إعداد الملفات والدراسات وتسجيل المقترحات والمشروعات ضمن نطاق عمل القسم.'}</p><div class="actions">${r.type==='employee'?btn('＋ مقترح جديد',"navigate('new')",'primary'):btn('فتح سجلات الأعمال',"navigate('cases')",'primary')}${r.type==='director'?btn('الخطة السنوية',"navigate('plan')",'dark'):''}${btn('المرصد الخارجي',"navigate('observatory')")}</div></section><div class="metrics">${[['ملفات في نطاقي',visible.length],['ملفات تحتاج إجراء',pending.length],['دروس مسجلة',db.lessons.filter(l=>r.type==='director'||visible.some(x=>x.id===l.caseId)).length],['مؤشرات معرّفة',db.indicators.length]].map(([a,b])=>`<div class="metric"><div class="muted">${a}</div><div class="num">${b}</div></div>`).join('')}</div><div class="grid"><section class="panel"><h3>الأعمال التي تحتاج متابعة</h3>${pending.length?pending.slice(0,6).map(x=>`<div class="trace-item"><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.id)}　${esc(x.status)}</div>${btn('عرض الملف',`openCase('${x.id}')`)}</div>`).join(''):'<div class="empty">لا توجد أعمال معلقة حاليًا.</div>'}</section><section class="panel"><h3>الوصول المباشر</h3><div class="grid">${[['catalog','خريطة العمليات'],['specializations','العمليات التخصصية'],['gis','الفضاءات العامة وGIS'],['observatory','المصادر والأفكار الخارجية'],['learning','سجل التعلم'],['reports','التقارير']].map(([id,name])=>`<button class="cardsel" onclick="navigate('${id}')">${name}　↖</button>`).join('')}</div></section></div><div class="note tiny">نموذج تفاعلي للتصميم واختبار العمليات. الأدوار هنا محاكاة داخل المتصفح، وليست مصادقة أمنية أو نظام اعتماد رسمي.</div>`}
function dashPage(){let vis=db.cases.filter(inScope),stats={};vis.forEach(x=>stats[x.status]=(stats[x.status]||0)+1);return `<h1 class="h1">لوحة معلومات ${R().type==='director'?'الدائرة':R().type==='head'?'القسم':'الموظف'}</h1><p class="lead">تُحتسب الأرقام من سجلات هذا المتصفح وفق نطاق الدور المختار.</p><div class="metrics">${[['إجمالي الملفات',vis.length],['بانتظار الدراسة',vis.filter(x=>['مسندة','قيد المعالجة الفنية'].includes(x.status)).length],['بانتظار مراجعة القسم',vis.filter(x=>x.status==='قيد المراجعة').length],['بانتظار قرار المدير',vis.filter(x=>x.status==='بانتظار قرار المدير').length]].map(([a,b])=>`<div class="metric"><span class="muted">${a}</span><div class="num">${b}</div></div>`).join('')}</div>${panel('توزيع الحالات',Object.keys(stats).length?Object.entries(stats).map(([a,b])=>`<div style="margin:12px 0"><span>${esc(a)} — ${b}</span><div style="background:#e9efee;height:9px;border-radius:10px"><div style="background:#3d9590;width:${Math.round(b/vis.length*100)}%;height:100%;border-radius:10px"></div></div></div>`).join(''):'<div class="empty">أضف ملفات عمل لإظهار المؤشرات.</div>')}${R().type==='director'?panel('متابعة الخطة والمؤشرات',`<p>بنود الخطة: <b>${db.annual.length}</b> — المؤشرات: <b>${db.indicators.length}</b></p>${btn('إدارة الخطة والمؤشرات',"navigate('plan')",'primary')}`):''}`}
function newPage(){if(R().type!=='employee')return `<h1 class="h1">تسجيل موضوع أو مقترح</h1><div class="warning">إنشاء الطلبات الفنية من مسؤوليات الموظف المختص. استخدم «سجل الموضوعات» للمراجعة والتوجيه، أو بدّل الدور لمعاينة التسجيل.</div>`;return `<h1 class="h1">تسجيل موضوع أو مقترح</h1><p class="lead">مرحلة التسجيل الأولي — التفاصيل الفنية تستكمل حسب المسار المختص، ولا نطلب اسم الشخص المقدم.</p><section class="panel"><h3>1. المصدر والمرجع</h3><div class="grid">${field('source','مصدر الموضوع',selectHtml('source',[['employee','مقترح داخلي من الموظف'],['department','دائرة أخرى داخل البلدية'],['external','جهة خارجية'],['assignment','تكليف إداري']]))}${field('entity','اسم الدائرة أو الجهة (إلزامي إذا كان المصدر مؤسسيًا)','placeholder="اسم الدائرة أو الجهة"')}${field('refNo','رقم وتاريخ الخطاب / المرجع (إذا وجد)')}${field('owner','الدائرة المالكة للمشروع إن اختلفت (للمشروعات)')}</div></section><section class="panel"><h3>2. تعريف الموضوع واحتياجه</h3><div class="grid">${field('title','العنوان *')}${field('kind','نوع الموضوع',selectHtml('kind',[['مقترح','مقترح'],['مشروع وارد','مشروع وارد للمراجعة'],['خطة','خطة'],['مبادرة','مبادرة'],['طلب رأي','طلب رأي']]))}${field('problem','المشكلة أو الاحتياج *', '<textarea id="problem" rows="3"></textarea>')}${field('description','الوصف والحل المقترح *','<textarea id="description" rows="3"></textarea>')}${field('required','المطلوب من دائرة التنمية الحضرية *','<textarea id="required" rows="2"></textarea>')}${field('location','الموقع أو النطاق الجغرافي (عند انطباقه)')}</div></section><section class="panel"><h3>3. المدخلات الأولية المتوفرة</h3><div class="grid">${field('rationale','المبررات والأدلة الأولية','<textarea id="rationale" rows="2"></textarea>')}${field('objectives','الأهداف والنتائج المتوقعة','<textarea id="objectives" rows="2"></textarea>')}${field('beneficiaries','الفئات المستفيدة والجهات المتأثرة')}${field('constraints','الموارد والقيود والاعتماديات المعروفة')}${field('docs','مراجع المستندات والمخططات ونسخها','<textarea id="docs" rows="2" placeholder="مرجع PDF أو اسم المخطط وإصداره؛ حفظ المرفقات الفعلي يتطلب نظام مستندات"></textarea>')}${field('track','مسار الدراسة الفني المقترح',selectHtml('track',Object.entries(tracks).filter(([k,t])=>t.dept===R().dept||t.dept==='مشترك').map(([k,t])=>[k,t.name])) )}</div><div class="actions">${btn('تسجيل ملف جديد',"saveCase()",'primary')}</div></section><div class="note tiny">لا يُطلب إدخال التكلفة أو الدراسات التفصيلية عند تسجيل فكرة أولية؛ يتم التحقق من اكتمال البيانات المتخصصة قبل إصدار الدراسة أو التوصية.</div>`}
function saveCase(){const source=v('source');if(!v('title')||!v('problem')||!v('description')||!v('required'))return toast('يرجى استكمال العنوان والمشكلة والوصف والمطلوب.');if(['department','external','assignment'].includes(source)&&!v('entity'))return toast('اسم الدائرة أو الجهة مطلوب لهذا المصدر.');let x={id:id('UD'),source,entity:source==='employee'?'دائرة التنمية الحضرية':v('entity'),owner:v('owner'),refNo:v('refNo'),title:v('title'),kind:v('kind'),problem:v('problem'),description:v('description'),required:v('required'),location:v('location'),rationale:v('rationale'),objectives:v('objectives'),beneficiaries:v('beneficiaries'),constraints:v('constraints'),docs:v('docs'),track:v('track'),dept:R().dept,status:'مسجلة',created:now(),technical:'',recommendation:'',review:'',decision:'',issued:'',response:'',studydoc:'',evidence:'',assigned:'',records:[]};db.cases.unshift(x);logAudit(x,'تسجيل ملف');selected=x.id;page='cases';render();toast('تم تسجيل الملف ضمن نطاق القسم')}
function casesPage(){let list=db.cases.filter(inScope).filter(x=>filter==='all'||x.status===filter);return `<h1 class="h1">سجل الموضوعات والمقترحات</h1><p class="lead">سجل واحد لكل موضوع، مع مسارات دراسة تخصصية ومتابعة القرار والمخرجات.</p><div class="actions">${R().type==='employee'?btn('＋ تسجيل موضوع',"navigate('new')",'primary'):''}<select style="width:220px" onchange="filter=this.value;render()">${[['all','كل الحالات'],['قيد المعالجة الفنية','قيد المعالجة الفنية'],['قيد المراجعة','قيد المراجعة'],['بانتظار قرار المدير','بانتظار قرار المدير'],['صادرة','صادرة']].map(([a,b])=>`<option ${filter===a?'selected':''} value="${a}">${b}</option>`).join('')}</select>${btn('تصدير CSV',"exportCSV('cases')")}</div>${panel('سجل العمل',table(['المرجع','الموضوع','القسم','الجهة','المسار','الحالة','الملف'],list.map(x=>[esc(x.id),esc(x.title),esc(x.dept),esc(x.entity),esc(tracks[x.track]?.name||''),badge(x.status),btn('فتح',`openCase('${x.id}')`)])))}`}
function openCase(i){selected=i;caseTab='overview';page='cases';render()}function c(){return db.cases.find(x=>x.id===selected)}function showCaseTab(t){caseTab=t;render()}function detailPage(){let x=c();if(!x||!inScope(x))return '<div class="warning">لا تملك صلاحية الاطلاع على هذا الملف.</div>';let stages=['التسجيل والفحص','التوجيه والدراسة','المراجعة الفنية','قرار المدير','الإصدار والمتابعة'];let current=routeStatus(x);const sections=[['overview','ملخص الملف'],['study','المدخلات والدراسة'],['coordination','التنسيق'],['review','المراجعة والقرار'],['learning','التعلم'],['audit','سجل الإجراءات']];return `<div class="actions">${btn('↩ العودة للسجل',"selected=null;render()")}${btn('طباعة الملف / PDF','window.print()')}${btn('تصدير بيانات CSV',`exportCase('${x.id}')`)}</div><div class="banner"><span class="pill">${esc(x.id)}</span><h1 class="h1">${esc(x.title)}</h1><div class="inline"><span class="muted">${esc(x.dept)} — ${esc(x.entity)}</span>${badge(x.status)}</div></div><div class="stepper">${stages.map((s,i)=>`<div class="step ${i<current?'done':i===current?'current':''}">${i+1}. ${s}</div>`).join('')}</div><section class="panel"><div class="tabs">${sections.map(([t,n])=>`<button class="tab ${caseTab===t?'active':''}" onclick="showCaseTab('${t}')">${n}</button>`).join('')}</div>${({overview:()=>overview(x),study:()=>study(x),coordination:()=>coordination(x),review:()=>review(x),learning:()=>caseLearning(x),audit:()=>caseAudit(x)})[caseTab]()}</section>`}
function overview(x){return `<div class="grid">${[['الجهة المحيلة',x.entity],['الدائرة المالكة (إن وجدت)',x.owner||'لم تُحدد'],['نوع الموضوع',x.kind],['المرجع الوارد',x.refNo||'غير متوفر'],['الموقع',x.location||'غير محدد'],['المسار',tracks[x.track]?.name||''],['القسم',x.dept],['التسجيل',x.created]].map(([k,val])=>`<div class="docbox"><span class="muted tiny">${k}</span><div>${esc(val)}</div></div>`).join('')}</div><h4>المشكلة والمطلوب</h4><p>${esc(x.problem)}</p><p>${esc(x.required)}</p>${actionButtons(x)}`}
function actionButtons(x){let a=[];if(canEdit(x)&&x.status==='مسجلة')a.push(btn('الفحص مكتمل وإحالة للتوجيه',`changeStatus('${x.id}','مسندة')`,'primary'),btn('بانتظار استكمال',`changeStatus('${x.id}','بانتظار استكمال')`,'warn'));if(canEdit(x)&&x.status==='بانتظار استكمال')a.push(btn('استلمت الاستكمال',`changeStatus('${x.id}','مسجلة')`));if(canReview(x)&&x.status==='مسندة')a.push(btn('تكليف الدراسة الفنية',`changeStatus('${x.id}','قيد المعالجة الفنية')`,'primary'));if(canEdit(x)&&x.status==='قيد المعالجة الفنية')a.push(btn('إرسال المخرج للمراجعة',`submitStudy('${x.id}')`,'primary'));if(canReview(x)&&x.status==='قيد المراجعة')a.push(btn('اعتماد المراجعة ورفع للمدير',`approveReview('${x.id}')`,'primary'),btn('إعادة للموظف',`changeStatus('${x.id}','قيد المعالجة الفنية')`,'warn'));if(R().type==='director'&&x.status==='بانتظار قرار المدير')a.push(btn('اعتماد إصدار المخرج',`directorDecision('${x.id}','جاهزة للإصدار')`,'primary'),btn('إعادة للدراسة',`directorDecision('${x.id}','قيد المعالجة الفنية')`,'warn'));if(R().type==='director'&&x.status==='جاهزة للإصدار')a.push(btn('تسجيل الإصدار',`directorDecision('${x.id}','صادرة')`,'primary'));if(canReview(x)&&x.status==='صادرة')a.push(btn('متابعة الاستجابة',`changeStatus('${x.id}','قيد متابعة الاستجابة')`),btn('إغلاق المعاملة',`changeStatus('${x.id}','مغلقة')`));if(canReview(x)&&x.status==='قيد متابعة الاستجابة')a.push(btn('إغلاق بعد التحقق',`changeStatus('${x.id}','مغلقة')`));return a.length?`<div class="actions">${a.join('')}</div>`:''}
function changeStatus(i,s){let x=db.cases.find(z=>z.id===i);if(!x)return;let allowed=(canEdit(x)&&[['مسجلة','مسندة'],['مسجلة','بانتظار استكمال'],['بانتظار استكمال','مسجلة']].some(a=>a[0]===x.status&&a[1]===s))||(canReview(x)&&[['مسندة','قيد المعالجة الفنية'],['قيد المراجعة','قيد المعالجة الفنية'],['صادرة','قيد متابعة الاستجابة'],['صادرة','مغلقة'],['قيد متابعة الاستجابة','مغلقة']].some(a=>a[0]===x.status&&a[1]===s));if(!allowed)return toast('الإجراء غير مسموح لدورك أو لحالة الملف.');let old=x.status;x.status=s;logAudit(x,'تغيير الحالة',old+' ← '+s);render()}
function study(x){let t=tracks[x.track]||tracks.project;return `<div class="grid"><div><h4>مدخلات الدراسة الخاصة بالمسار</h4>${t.inputs.map((f,i)=>`<div class="trace-item">${i+1}. ${esc(f)}</div>`).join('')}</div><div><h4>مخرجات الدراسة</h4>${t.outputs.map((f,i)=>`<div class="trace-item">${i+1}. ${esc(f)}</div>`).join('')}</div></div><details class="drawer"><summary>مدخلات التسجيل الموثقة</summary><div>${[['الوصف',x.description],['المبررات',x.rationale],['الأهداف',x.objectives],['المستفيدون',x.beneficiaries],['الموارد والقيود',x.constraints],['المستندات والإصدارات',x.docs]].map(([k,v])=>`<p><b>${k}:</b> ${esc(v||'غير متوفر')}</p>`).join('')}</div></details>${t.method?`<div class="note"><b>طريقة العمل</b><p>${esc(t.method)}</p></div>`:''}<h4>إعداد التحليل ومخرجاته</h4>${canEdit(x)&&['مسندة','قيد المعالجة الفنية'].includes(x.status)?`<div class="grid">${field('technical','التحليل الفني والبدائل','<textarea id="technical" rows="5">'+esc(x.technical)+'</textarea>')}${field('evidence','الأدلة والمصادر والبيانات غير المكتملة','<textarea id="evidence" rows="5">'+esc(x.evidence)+'</textarea>')}${field('recommendation','التوصية المهنية *','<textarea id="recommendation" rows="5">'+esc(x.recommendation)+'</textarea>')}${field('studydoc','المخرجات والمستندات ورقم إصدارها','<textarea id="studydoc" rows="5">'+esc(x.studydoc)+'</textarea>')}</div>${btn('حفظ الدراسة',`saveStudy('${x.id}')`,'primary')}`:`<div class="docbox"><p><b>التحليل:</b> ${esc(x.technical||'لم يُعد بعد')}</p><p><b>الأدلة:</b> ${esc(x.evidence||'—')}</p><p><b>التوصية:</b> ${esc(x.recommendation||'—')}</p><p><b>المخرج:</b> ${esc(x.studydoc||'—')}</p></div>`}${actionButtons(x)}`}
function saveStudy(i){let x=db.cases.find(z=>z.id===i);if(!x||!canEdit(x)||!['مسندة','قيد المعالجة الفنية'].includes(x.status))return toast('لا تسمح الصلاحية بالتعديل.');['technical','evidence','recommendation','studydoc'].forEach(k=>x[k]=v(k));if(!x.technical||!x.recommendation)return toast('التحليل والتوصية مطلوبان.');if(x.status==='مسندة')x.status='قيد المعالجة الفنية';logAudit(x,'حفظ مسودة الدراسة');render();toast('حُفظت مسودة الدراسة')}
function submitStudy(i){let x=db.cases.find(z=>z.id===i);if(!x||!canEdit(x)||x.status!=='قيد المعالجة الفنية')return toast('الإجراء غير متاح.');if(!x.technical||!x.recommendation)return toast('يلزم حفظ التحليل والتوصية أولًا.');x.status='قيد المراجعة';logAudit(x,'رفع الدراسة لرئيس القسم');render()}
function coordination(x){return `<div class="note">التنسيق خدمة مشتركة حسب الحاجة، ويمكن طلب مرئيات متعددة بالتوازي؛ لا يعتبر غياب الرد موافقة.</div><h4>طلبات البيانات والمرئيات</h4>${x.records.length?table(['الجهة','البيانات المطلوبة','المهلة','الحالة'],x.records.map(k=>[esc(k.entity),esc(k.need),esc(k.deadline),badge(k.status)])):'<div class="empty">لا توجد طلبات بيانات أو مرئيات مرتبطة.</div>'}${canEdit(x)?`<div class="grid">${field('coordEntity','الجهة المطلوب التنسيق معها')}${field('coordNeed','البيانات أو المرئيات المطلوبة')}${field('coordDeadline','تاريخ مطلوب للرد','type="date"')}</div><div class="actions">${btn('تسجيل طلب تنسيق',`addCoord('${x.id}')`,'primary')}</div>`:''}`}
function addCoord(i){let x=db.cases.find(z=>z.id===i);if(!x||!canEdit(x))return toast('غير مصرح');if(!v('coordEntity')||!v('coordNeed'))return toast('الجهة والمطلوب إلزاميان');x.records.push({entity:v('coordEntity'),need:v('coordNeed'),deadline:v('coordDeadline'),status:'بانتظار رد'});logAudit(x,'إضافة طلب تنسيق');render()}
function review(x){return `<div class="grid"><div class="docbox"><h4>المراجعة الفنية</h4><p>${esc(x.review||'لم تُسجل المراجعة بعد')}</p>${canReview(x)&&x.status==='قيد المراجعة'?`${field('reviewText','ملاحظات المراجعة','<textarea id="reviewText" rows="3"></textarea>')}${btn('حفظ المراجعة',`saveReview('${x.id}')`)}`:''}</div><div class="docbox"><h4>قرار مدير الدائرة</h4><p>${esc(x.decision||'بانتظار توجيه المدير')}</p>${R().type==='director'&&x.status==='بانتظار قرار المدير'?`${field('decisionText','مبررات القرار أو التوجيه','<textarea id="decisionText" rows="3"></textarea>')}${btn('حفظ الملاحظات',`saveDecision('${x.id}')`)}`:''}</div></div>${actionButtons(x)}`}
function saveReview(i){let x=db.cases.find(z=>z.id===i);if(!x||!canReview(x)||x.status!=='قيد المراجعة')return;x.review=v('reviewText');logAudit(x,'ملاحظات رئيس القسم');render()}
function approveReview(i){let x=db.cases.find(z=>z.id===i);if(!x||!canReview(x)||x.status!=='قيد المراجعة')return toast('غير مسموح');if(!x.technical||!x.recommendation)return toast('المخرجات غير مكتملة');x.status='بانتظار قرار المدير';logAudit(x,'اجتياز المراجعة الفنية');render()}
function saveDecision(i){let x=db.cases.find(z=>z.id===i);if(R().type!=='director'||!x||x.status!=='بانتظار قرار المدير')return;x.decision=v('decisionText');logAudit(x,'تسجيل توجيه المدير');render()}
function directorDecision(i,s){let x=db.cases.find(z=>z.id===i);if(R().type!=='director'||!x)return toast('غير مصرح');if(!((x.status==='بانتظار قرار المدير'&&['جاهزة للإصدار','قيد المعالجة الفنية'].includes(s))||(x.status==='جاهزة للإصدار'&&s==='صادرة')))return toast('انتقال حالة غير مسموح');if(s==='صادرة'&&!x.decision)return toast('سجّل مرجع القرار أو التوجيه أولًا.');x.status=s;logAudit(x,'قرار المدير',s);render()}
function caseLearning(x){let lessons=db.lessons.filter(z=>z.caseId===x.id);return `<p class="muted">سجل تعلم مستمر لكل ملف، ولا يحتاج انتظار انتهاء المعاملة.</p>${lessons.length?table(['الملاحظة','الدرس','الإجراء التحسيني','الحالة'],lessons.map(l=>[esc(l.observation),esc(l.lesson),esc(l.action),badge(l.status)])):'<div class="empty">لا توجد دروس مرتبطة بهذا الملف.</div>'}${canEdit(x)?`<div class="grid">${field('lessonObs','ما الذي حدث؟','<textarea id="lessonObs" rows="2"></textarea>')}${field('lessonWhy','لماذا حدث؟ وما الدليل؟','<textarea id="lessonWhy" rows="2"></textarea>')}${field('lessonText','الدرس المستفاد','<textarea id="lessonText" rows="2"></textarea>')}${field('lessonAction','التوصية أو الإجراء التحسيني','<textarea id="lessonAction" rows="2"></textarea>')}</div>${btn('تسجيل درس مستفاد',`addLesson('${x.id}')`,'primary')}`:''}`}
function addLesson(i){let x=db.cases.find(z=>z.id===i);if(!x||!canEdit(x))return toast('غير مصرح');if(!v('lessonObs')||!v('lessonText'))return toast('أدخل الملاحظة والدرس');db.lessons.push({id:id('LRN'),caseId:i,observation:v('lessonObs'),why:v('lessonWhy'),lesson:v('lessonText'),action:v('lessonAction'),status:'مسجل',at:now()});logAudit(x,'تسجيل درس مستفاد');render()}
function caseAudit(x){const aud=db.audit.filter(z=>z.caseId===x.id);return aud.length?aud.map(z=>`<div class="trace"><div class="trace-item"><b>${esc(z.action)}</b> <span class="tiny muted">${esc(z.at)}</span><div class="tiny">${esc(z.actor)}</div><div class="muted tiny">${esc(z.note)}</div></div></div>`).join(''):'<div class="empty">لا يوجد سجل تدقيق بعد.</div>'}
function catalogPage(){return `<h1 class="h1">خريطة العمليات</h1><p class="lead">حفظ الإجراءات المرجعية الاثني عشر وتوجيهها إلى عمليات تخصصية وخدمات مشتركة، دون تكرار تسجيل الموضوع.</p>${panel('الإجراءات المرجعية',table(['الرمز','الإجراء','طبيعة المسار','التخصص'],procedures.map(([id,n,key])=>[id,esc(n),key==='shared'?'خدمة مشتركة':key==='plan'?'إدارة الخطة':'دراسة تخصصية',esc(tracks[key]?.dept||'مشترك')]))) }${panel('المراحل المشتركة',`<div class="flow">${['تسجيل مرجعي وفحص أولي','توجيه إلى القسم المعني بحسب نوع الدراسة','دراسة تخصصية وتنسيق حسب الحاجة','مراجعة فنية لرئيس القسم','توجيه مدير الدائرة','إصدار المخرج ومتابعة الاستجابة'].map((s,i)=>`<div class="flowbox">${i+1}. ${s}</div>${i<5?'<div class="arrow">↓</div>':''}`).join('')}</div>`)}<div class="warning">الاثنا عشر إجراءً قوالب مرجعية للعمل، وليست إجراءات رسمية معتمدة. يجب مراجعة التفويضات ومدد الإنجاز مع الدائرة قبل التشغيل الرسمي.</div>`}
function specialPage(){return `<h1 class="h1">الدراسات والعمليات المتخصصة</h1><p class="lead">اختر مسار الدراسة للاطلاع على البيانات المطلوبة وطريقة العمل والمخرجات.</p><div class="actions"><select style="max-width:350px" onchange="trackView=this.value;render()">${Object.entries(tracks).map(([k,t])=>`<option value="${k}" ${trackView===k?'selected':''}>${t.name}</option>`).join('')}</select></div>${panel(tracks[trackView].name,`<div class="grid"><div><h4>مدخلات الدراسة</h4>${tracks[trackView].inputs.map(x=>`<div class="trace-item">• ${esc(x)}</div>`).join('')}</div><div><h4>مخرجات مرحلية ونهائية</h4>${tracks[trackView].outputs.map(x=>`<div class="trace-item">✓ ${esc(x)}</div>`).join('')}</div></div>${tracks[trackView].method?`<div class="note"><b>طريقة العمل</b><p>${esc(tracks[trackView].method)}</p></div>`:''}<div class="note tiny">الموظف يجمع البيانات ويُعد المخرج؛ رئيس القسم يراجعه؛ مدير الدائرة يراجع الأولوية والأثر ويعتمد وفق التفويض. التعلم والتنسيق متاحان بكل مسار.</div>`)}${panel('تدرج متطلبات البيانات',`<div class="grid4">${['تسجيل أولي','تخطيط الدراسة','جمع الأدلة والتحليل','إصدار المخرج'].map((a,i)=>`<div class="docbox"><b>${i+1}. ${a}</b><p class="tiny muted">${['بيانات المصدر والمشكلة والمطلوب','تحديد البيانات والمعايير والتنسيق','مصادر موثقة وفجوات وبدائل','مذكرة وتحليل ونسخ وثائق وتوصية'][i]}</p></div>`).join('')}</div>`)}`}
function projectsPage(){return `<h1 class="h1">المشروعات والمتابعة الحضرية</h1><p class="lead">المشروع ملك للدائرة المنفذة؛ تتولى دائرة التنمية الحضرية مراجعة المشروع أو متابعة مساهمته في الأهداف.</p>${panel('دورة المتابعة والتقييم',table(['المرحلة','المدخلات الأساسية','المخرج'],[['تسجيل مرجعي','اسم الدائرة المالكة، ملف المشروع، الموقع، المخططات والإصدارات','بطاقة مشروع موثقة المصدر'],['ربط الأهداف','أهداف الدائرة، وصف المشروع، المستفيدون، النتائج المتوقعة','مصفوفة ارتباط أهداف ونتائج'],['خطة متابعة وتقييم','المؤشرات، خط الأساس، المستهدف، المصدر، الدورية، الأدلة','خطة قياس مع المسؤوليات'],['استلام بيانات التقدم','تقارير الدائرة المالكة، أدلة، تواريخ، قيم مؤشرات','بيانات قابلة للتحقق'],['التقييم والتعلم','قيم فعلية ومستهدفات وملاحظات، عوامل التأثير','تقرير مساهمة ودروس وتحسينات']].map(a=>a.map(esc))))}<div class="note">لا تُفهم حالة «إنجاز المشروع» على أنها تحقق الهدف الحضري؛ فهما قياسان مختلفان. لا يُنشأ سجل تنفيذي مكرر لمشروع تملكه دائرة أخرى.</div>`}
function planPage(){return `<h1 class="h1">الخطة السنوية والمؤشرات</h1><p class="lead">مدير الدائرة يضع الخطة ومؤشرات الأداء ويتابعها؛ رؤساء الأقسام يراجعون الإنجاز، والموظفون يزوّدون بيانات التنفيذ والأدلة.</p>${R().type==='director'?panel('إنشاء بند بالخطة السنوية',`<div class="grid">${field('planTitle','عنوان بند الخطة')}${field('planDept','القسم المسؤول',selectHtml('planDept',[['أنسنة المدن','أنسنة المدن'],['السياسات والدراسات الحضرية','السياسات والدراسات الحضرية']]))}${field('planGoal','الهدف والنتيجة المتوقعة')}${field('planOutput','المخرج المطلوب')}${field('planDeadline','تاريخ الاستحقاق','type="date"')}${field('planMeasure','المؤشر والمستهدف المرتبطان')}</div><div class="actions">${btn('إضافة بند للخطة',"addPlan()",'primary')}</div>`):'<div class="note">يمكنك الاطلاع على بنود الخطة ضمن نطاق عملك. إنشاء الخطة وتعديلها من صلاحيات مدير الدائرة.</div>'}${panel('بنود الخطة',table(['الرمز','النشاط','القسم','الهدف والمخرج','الموعد'],db.annual.filter(x=>R().type==='director'||x.dept===R().dept).map(x=>[esc(x.id),esc(x.title),esc(x.dept),esc(x.goal)+' / '+esc(x.output),esc(x.deadline)])))}${R().type==='director'?panel('إنشاء مؤشر للدائرة',`<div class="grid">${field('indicatorName','اسم المؤشر')}${field('indicatorFormula','تعريف الحساب ووحدة القياس')}${field('indicatorSource','مصدر البيانات ومالكها')}${field('indicatorTarget','خط الأساس والمستهدف والدورية')}</div><div class="actions">${btn('إضافة مؤشر',"addIndicator()",'primary')}</div>`):''}${panel('المؤشرات',table(['اسم المؤشر','طريقة الحساب','مصدر البيانات','المستهدف'],db.indicators.map(x=>[esc(x.name),esc(x.formula),esc(x.source),esc(x.target)])))}`}

function gisPage(){return `<h1 class="h1">الفضاءات العامة وGIS</h1><p class="lead">سجل مكاني مرجعي واحد، مع طبقات ومؤشرات حالة وزيارات وتدخلات. لا يتوفر اتصال حالي بقاعدة GIS الفعلية.</p>${panel('طبقات البيانات اللازمة',`<div class="grid3">${['حدود الولايات والأحياء','حدود الفضاءات العامة ومعرفاتها','الحدائق والمماشي والساحات والشواطئ','المداخل والمرافق والخدمات','شبكة المشاة والنقل','الغطاء الأخضر والظل','الوصول الشامل والسلامة','الملكية والجهة المشرفة','التدخلات والمشروعات','زيارات التقييم والحالة الزمنية','الصور والوثائق والمخططات','السكان ومناطق الخدمة'].map(x=>`<div class="docbox">${x}</div>`).join('')}</div>`)}${panel('سجل المواقع',table(['الموقع','نوع الفضاء','الولاية','معرف GIS','الحالة'],db.gis.map(x=>[esc(x.name),esc(x.type),esc(x.wilaya),esc(x.geometry||'غير متحقق'),badge(x.status)])))}${R().type==='employee'&&R().dept==='أنسنة المدن'?panel('إضافة موقع للحصر والتحقق',`<div class="grid">${field('siteName','اسم الفضاء')}${field('siteType','نوع الفضاء')}${field('siteWilaya','الولاية')}${field('siteGeom','مرجع طبقة GIS / المعرف المكاني')}</div>${btn('إضافة للمراجعة',"addSite()",'primary')}`):''}<div class="warning">الحصر الشامل لجميع الفضاءات في الولاية لا يمكن التحقق منه من النموذج المحلي دون استيراد طبقات البلدية الرسمية. إضافة الموقع هنا لا تعني اعتماد حدوده أو حالة تقييمه.</div>`}
function addSite(){if(R().type!=='employee'||R().dept!=='أنسنة المدن')return toast('غير مسموح');if(!v('siteName')||!v('siteWilaya'))return toast('الاسم والولاية مطلوبان');db.gis.push({name:v('siteName'),wilaya:v('siteWilaya'),type:v('siteType'),geometry:v('siteGeom'),status:'بانتظار تحقق GIS'});persist();render()}
const sources=[['UN-Habitat','https://unhabitat.org','تخطيط حضري واستدامة'],['ITDP','https://itdp.org','نقل مستدام وشوارع'],['C40 Cities','https://www.c40.org','مدن ومناخ'],['NACTO','https://nacto.org','تصميم الشوارع'],['WHO Healthy Cities','https://www.who.int','المدن والصحة العامة'],['UNEP','https://www.unep.org','البيئة الحضرية']];function observPage(){return `<h1 class="h1">المرصد الخارجي</h1><p class="lead">المصدر الإلكتروني هو الموقع، والمادة المنشورة تقرير أو خبر فيه، والفكرة الخارجية هي فرصة تُستخلص منه وتُراجع قبل تسجيل مقترح داخلي.</p>${panel('مصادر مرجعية قابلة للفتح',table(['المصدر','المجال','الرابط'],sources.map(x=>[esc(x[0]),esc(x[2]),`<a href="${x[1]}" target="_blank" rel="noopener noreferrer">فتح الموقع الأصلي</a>`])))}${panel('الأفكار والفرص المستخلصة',table(['الفكرة','المادة الأصلية','المصدر','الملاءمة'],db.externalIdeas.map(x=>[esc(x.idea),esc(x.article),esc(x.source),esc(x.relevance)])))}${R().type==='employee'?panel('حفظ فكرة من مصدر خارجي',`<div class="grid">${field('obsSource','المصدر',selectHtml('obsSource',sources.map(s=>[s[0],s[0]])))}${field('obsArticle','عنوان المادة المنشورة')}${field('obsUrl','رابط المادة','type="url"')}${field('obsIdea','الفكرة المستخلصة')}${field('obsRelevance','سبب ملاءمتها لظفار')}</div>${btn('حفظ فكرة خارجية',"addExternalIdea()",'primary')}`):''}<div class="note tiny">هذه قائمة مصادر ثابتة قابلة للفتح. الجلب التلقائي للأخبار والبحث عبر المواقع يحتاجان خدمة خلفية وواجهات RSS/API متاحة أو فهرسة مصرحًا بها، ولم يُنفذا هنا. لا يوجد تكامل ذكاء اصطناعي.</div>`}

function rolesPage(){return `<h1 class="h1">الأدوار والضوابط</h1><p class="lead">ثلاثة مستويات إدارية؛ ويتحدد نطاق رئيس القسم والموظف بالقسم والتكليف.</p>${panel('مصفوفة المسؤوليات',table(['الإجراء','الموظف المختص','رئيس القسم','مدير الدائرة'],[['تسجيل مقترح أو مشروع','إنشاء ضمن القسم','إشراف','توجيه'],['إعداد الدراسة','تنفيذ','مراجعة','توجيه استراتيجي'],['التكليف وتوزيع العمل','استلام','توزيع بالقسم','توجيه القسمين'],['اعتماد المخرج','لا','توصية بالرفع','اعتماد ضمن التفويض'],['إنشاء الخطة السنوية','لا','مدخلات القسم','إنشاء وإدارة'],['إنشاء مؤشر الدائرة','لا','اقتراح فني','إنشاء وإقرار'],['تحديث بيانات مؤشر','جمع وإدخال','تحقق','متابعة وتقييم'],['سجل التعلم','تسجيل','مراجعة','توجيه التحسين'],['استخراج التقارير','نطاق التكليف','نطاق القسم','نطاق الدائرة']].map(a=>a.map(esc))))}<div class="warning">تبديل الدور في هذا النموذج هو أداة عرض واختبار، وليس مصادقة مستخدم أو ضمانًا أمنيًا. في الإنتاج يجب تطبيق RBAC والتحقق من نطاق البيانات والتفويض وسجل التدقيق على الخادم.</div>`}
function reportsPage(){return `<h1 class="h1">التقارير والتصدير</h1><p class="lead">استخراج بيانات قابلة للفتح في Excel، وطباعة التقارير العربية أو حفظها PDF من المتصفح.</p><div class="actions">${btn('تصدير المعاملات CSV',"exportCSV('cases')",'primary')}${btn('تصدير الخطة CSV',"exportCSV('annual')")}${btn('تصدير المؤشرات CSV',"exportCSV('indicators')")}${btn('تصدير التعلم CSV',"exportCSV('lessons')")}${btn('طباعة / حفظ PDF','window.print()','dark')}</div>${panel('ملخص البيانات المعروضة',`<div class="metrics"><div class="metric">المعاملات<div class="num">${db.cases.filter(inScope).length}</div></div><div class="metric">بنود الخطة<div class="num">${db.annual.filter(x=>R().type==='director'||x.dept===R().dept).length}</div></div><div class="metric">المؤشرات<div class="num">${db.indicators.length}</div></div><div class="metric">دروس التعلم<div class="num">${db.lessons.length}</div></div></div>`)}<div class="warning tiny">لا يُولّد النموذج ملفات XLSX أصلية أو PDF بخادم. CSV يفتح في Excel، ويمكن حفظ PDF من أمر الطباعة. البيانات المخزنة محليًا ليست مستودعًا رسميًا.</div>`}
function downloadCSV(rows,filename){if(!rows.length)return toast('لا توجد بيانات للتصدير');const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];const csv='\ufeff'+[keys,...rows.map(r=>keys.map(k=>String(r[k]??'')))].map(line=>line.map(a=>'"'+String(a).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}function exportCSV(group){let rows=db[group]||[];if(group==='cases')rows=rows.filter(inScope);if(group==='annual')rows=rows.filter(x=>R().type==='director'||x.dept===R().dept);if(group==='lessons'&&R().type!=='director'){let allowed=db.cases.filter(inScope).map(x=>x.id);rows=rows.filter(x=>allowed.includes(x.caseId))}downloadCSV(rows,group+'-dhofar.csv')}function exportCase(i){let x=db.cases.find(z=>z.id===i);if(!x||!inScope(x))return toast('غير مصرح');downloadCSV([x],'case-'+i+'.csv')}

const DEPT_HUM='أنسنة المدن', DEPT_POL='السياسات والدراسات الحضرية';
function ownsDepartment(dept){return R().type==='director'||R().dept===dept}
function mayUpdate(dept){return R().type==='employee'&&R().dept===dept}
function mayVerify(dept){return R().type==='head'&&R().dept===dept}
function dcount(a,fn){return (a||[]).filter(fn||(()=>true)).length}
function dateStamp(){return new Date().toISOString().slice(0,10)}
function safeNum(v){return v===''?null:Number(v)}
function evidenceValid(ref,source,date){return Boolean(ref&&source&&date)}
function rowNotice(text){return `<div class="emphasis">${text}</div>`}
function miniMetric(label,note,value){return `<div class="metric"><div class="muted">${label}</div><div class="num">${value}</div><div class="tiny muted">${note}</div></div>`}
function percentBar(v){let n=Math.max(0,Math.min(100,Number(v)||0));return `<div class="bar-track"><div class="bar-fill" style="width:${n}%"></div></div>`}
function scopedPlans(){return db.annual.filter(p=>ownsDepartment(p.dept))}
function scopedReads(){return db.indicatorReadings.filter(x=>{let ind=db.indicators.find(i=>i.id===x.indicatorId);return ind&&ownsDepartment(ind.dept||DEPT_HUM)})}
function evidenceLabel(row){return row.evidenceRef?esc(row.evidenceRef)+' · '+esc(row.evidenceSource||''):'لم يُسجّل'}
function verifiedUpdates(planId){return db.planUpdates.filter(x=>x.planId===planId&&x.status==='تم التحقق')}
function latestApprovedProgress(planId){let a=verifiedUpdates(planId);return a.length?a[a.length-1].progress:null}
function registerPlan(){if(R().type!=='director')return toast('إنشاء الخطة لمدير الدائرة فقط');let title=v('plTitle'),dept=v('plDept'),goal=v('plGoal'),output=v('plOutput'),deadline=v('plEnd');if(!title||!goal||!output||!deadline)return toast('العنوان والهدف والمخرج والموعد مطلوبة');db.annual.push({id:id('PLN'),title,dept,goal,output,deadline,measure:v('plMeasure'),start:v('plStart'),weight:v('plWeight')||'1',milestones:v('plMilestones'),dependencies:v('plDependencies'),evidenceRequirements:v('plEvidence'),status:'ضمن الخطة',created:now(),version:db.meta.planVersion});persist();render();toast('تم إنشاء بند الخطة')}
function registerPlanUpdate(planId){let p=db.annual.find(x=>x.id===planId);if(!p||!mayUpdate(p.dept))return toast('لا تملك صلاحية هذا التحديث');let quantity=v('puProgress'),deliverable=v('puDeliverable'),ref=v('puEvidence'),source=v('puSource'),date=v('puDate'),period=v('puPeriod');if(quantity===''||Number(quantity)<0||Number(quantity)>100||!deliverable||!period||!evidenceValid(ref,source,date))return toast('تحتاج نسبة تقدم بين 0 و100 وفترة ومخرج ودليل بمصدر وتاريخ');db.planUpdates.push({id:id('UPD'),planId,period,progress:Number(quantity),achievement:v('puWork'),deliverable,evidenceRef:ref,evidenceSource:source,evidenceDate:date,obstacles:v('puObstacles'),nextAction:v('puNext'),status:'بانتظار مراجعة رئيس القسم',created:now(),actor:R().name});persist();render();toast('حفظ تحديث الإنجاز مع دليل الإثبات')}
function verifyPlanUpdate(uid,accept){let u=db.planUpdates.find(x=>x.id===uid),p=db.annual.find(x=>x.id===u?.planId);if(!p||!mayVerify(p.dept)||u.status!=='بانتظار مراجعة رئيس القسم')return toast('لا يمكن مراجعة هذا التحديث');let note=prompt('ملاحظات التحقق أو سبب الإعادة (يمكن تركها فارغة عند القبول)')||'';if(!accept&&!note)return toast('سبب الإعادة مطلوب');u.status=accept?'تم التحقق':'معاد للاستكمال';u.reviewNote=note;u.reviewedBy=R().name;u.reviewedAt=now();persist();render();toast('تم حفظ قرار المراجعة')}
function revisePlan(){if(R().type!=='director')return toast('غير مصرح');let why=prompt('سبب إصدار نسخة جديدة من الخطة:');if(!why||!why.trim())return toast('يلزم توثيق سبب تعديل الخطة');db.planVersions.push({version:db.meta.planVersion,date:now(),reason:why,items:JSON.parse(JSON.stringify(db.annual))});db.meta.planVersion++;db.meta.planStatus='مسودة مراجعة';persist();render();toast('حُفظت النسخة السابقة، ويمكن تعديل البنود في الإصدار الجديد')}
function planPage(){let director=R().type==='director',plans=scopedPlans(),reviewQ=db.planUpdates.filter(u=>{let p=db.annual.find(x=>x.id===u.planId);return p&&mayVerify(p.dept)&&u.status==='بانتظار مراجعة رئيس القسم'});let allApproved=db.planUpdates.filter(x=>x.status==='تم التحقق');return `<h1 class="h1">الخطة السنوية للدائرة</h1><p class="lead">مدير الدائرة ينشئ الخطة والأهداف والمخرجات والمستهدفات؛ رؤساء الأقسام يوزعون العمل ويتحققون من الأدلة، والموظفون يسجلون الإنجاز الدوري. لا يحتسب التقدم المعتمد من تقارير غير متحقق منها.</p><div class="metrics">${miniMetric('سنة الخطة','نسخة '+db.meta.planVersion,db.meta.planYear)}${miniMetric('بنود ضمن النطاق','بنود الخطة',plans.length)}${miniMetric('تحديثات بانتظار التحقق','لا تدخل الأداء المعتمد',db.planUpdates.filter(u=>{let p=db.annual.find(x=>x.id===u.planId);return p&&ownsDepartment(p.dept)&&u.status==='بانتظار مراجعة رئيس القسم'}).length)}${miniMetric('تحديثات متحقق منها','أدلة مراجعة',allApproved.filter(u=>{let p=db.annual.find(x=>x.id===u.planId);return p&&ownsDepartment(p.dept)}).length)}</div>
${director?panel('إنشاء بند للخطة',`<div class="grid">${field('plTitle','النشاط أو العمل *')}${field('plDept','القسم المسؤول',selectHtml('plDept',[[DEPT_HUM,DEPT_HUM],[DEPT_POL,DEPT_POL]]))}${field('plGoal','الهدف والنتيجة المتوقعة *')}${field('plOutput','المخرج المطلوب ودليل اكتماله *')}${field('plStart','تاريخ البداية','type="date"')}${field('plEnd','تاريخ الإنجاز المستهدف *','type="date"')}${field('plMeasure','المؤشر والمستهدف المرتبطان')}${field('plWeight','الوزن النسبي (اختياري، لا يُحسب تلقائيًا)','type="number" min="0" step="0.1"')}${field('plMilestones','معالم العمل والمراحل','<textarea id="plMilestones" rows="3"></textarea>')}${field('plDependencies','الجهات والموارد والاعتماديات','<textarea id="plDependencies" rows="3"></textarea>')}${field('plEvidence','أدلة إثبات الإنجاز المطلوبة','<textarea id="plEvidence" rows="3"></textarea>')}</div><div class="actions">${btn('إضافة بند للخطة','registerPlan()','primary')}${btn('حفظ إصدار قبل تعديل الخطة','revisePlan()')}</div>`):rowNotice('يمكنك استعراض بنود الخطة المخصصة لقسمك وتسجيل التقدم أو مراجعته بحسب دورك؛ إنشاء الخطة وتغيير مستهدفاتها للمدير.')}
${panel('بنود الخطة والتقدم المعتمد',table(['المرجع','العمل والهدف','القسم','المخرج','الاستحقاق','التقدم الموثق','تحديث'],plans.map(x=>[esc(x.id),`<b>${esc(x.title)}</b><br><span class="muted">${esc(x.goal)}</span>`,esc(x.dept),esc(x.output),esc(x.deadline),latestApprovedProgress(x.id)===null?'<span class="muted">لم يُعتمد تحديث</span>':`${latestApprovedProgress(x.id)}% ${percentBar(latestApprovedProgress(x.id))}`,mayUpdate(x.dept)?btn('تحديث',`planSelected='${x.id}';render()`):btn('سجل التقدم',`planSelected='${x.id}';render()`)])))}
${planSelected&&db.annual.some(x=>x.id===planSelected&&ownsDepartment(x.dept))?planDetails(planSelected):''}
${reviewQ.length?panel('تحديثات بحاجة إلى مراجعة رئيس القسم',table(['التحديث','العمل','المخرج','الدليل','قرار'],reviewQ.map(u=>{let p=db.annual.find(x=>x.id===u.planId);return [esc(u.period),esc(p?.title),esc(u.deliverable),evidenceLabel(u),btn('تحقق',`verifyPlanUpdate('${u.id}',true)`,'primary')+' '+btn('إعادة',`verifyPlanUpdate('${u.id}',false)`,'warn')]}))):''}
${panel('حوكمة متابعة الخطة',`<div class="grid"><div class="small-card"><b>نسبة إنجاز النشاط</b><p class="muted tiny">تُحدد بمنهجية قياس واضحة، ثم يراجعها رئيس القسم؛ لا تُساوي قيمة المؤشر أو تحقق النتيجة الحضرية.</p></div><div class="small-card"><b>تغيير الخطة المعتمدة</b><p class="muted tiny">يحفظ المدير الإصدار السابق والسبب والتاريخ، مع إبقاء تاريخ الإنجاز الأصلي متاحًا للمقارنة.</p></div></div>`)}`}
let planSelected=null;
function planDetails(pid){let p=db.annual.find(x=>x.id===pid),us=db.planUpdates.filter(x=>x.planId===pid);return panel('سجل متابعة: '+esc(p.title),`<div class="data-tabs">${btn('إغلاق تفاصيل البند','planSelected=null;render()')}</div><div class="grid"><div class="small-card"><b>المخرج المطلوب</b><p>${esc(p.output)}</p><p class="muted tiny">${esc(p.evidenceRequirements||'تُحدد أدلة المخرج وفق نوعه')}</p></div><div class="small-card"><b>معالم العمل</b><p>${esc(p.milestones||'لا توجد معالم مدخلة')}</p></div></div>${mayUpdate(p.dept)?`<h4>تحديث الإنجاز وإثباته</h4><div class="grid">${field('puPeriod','فترة التقرير *','type="month"')}${field('puProgress','نسبة الإنجاز وفق منهجية النشاط *','type="number" min="0" max="100"')}${field('puWork','ما الذي تم إنجازه؟','<textarea id="puWork" rows="2"></textarea>')}${field('puDeliverable','المخرج المتحقق *','<textarea id="puDeliverable" rows="2"></textarea>')}${field('puEvidence','مرجع الدليل أو الملف *')}${field('puSource','مصدر الدليل أو الجهة المصدرة *')}${field('puDate','تاريخ الدليل *','type="date"')}${field('puObstacles','المعوقات وسبب الانحراف')}${field('puNext','الإجراء المطلوب')}</div><div class="actions">${btn('إرسال تحديث موثق للمراجعة',`registerPlanUpdate('${pid}')`,'primary')}</div>`:''}${table(['الفترة','الإنجاز','المخرج','مرجع الدليل','التحقق'],us.map(x=>[esc(x.period),esc(x.progress)+'%',esc(x.deliverable),evidenceLabel(x),badge(x.status)+(x.reviewNote?' '+esc(x.reviewNote):'')]))}`)}
function registerIndicator(){if(R().type!=='director')return toast('إنشاء المؤشر متاح لمدير الدائرة');let name=v('miName'),formula=v('miFormula'),source=v('miSource'),unit=v('miUnit'),period=v('miFrequency'),dept=v('miDept');if(!name||!formula||!source||!unit||!period)return toast('اسم المؤشر وصيغته ووحدته ومصدره ودوريته مطلوبة');db.indicators.push({id:id('KPI'),name,formula,source,dept,unit,frequency:period,baseline:v('miBaseline'),baselineEvidence:v('miBaselineEvidence'),target:v('miTarget'),targetEvidence:v('miTargetEvidence'),purpose:v('miPurpose'),classification:v('miClass'),created:now()});persist();render();toast('تم تعريف المؤشر')}
function registerReading(iid){let ind=db.indicators.find(x=>x.id===iid);if(!ind||!mayUpdate(ind.dept||DEPT_HUM))return toast('هذا القياس ليس ضمن صلاحية الموظف');let value=v('mrValue'),period=v('mrPeriod'),ref=v('mrEvidence'),source=v('mrSource'),date=v('mrDate');if(value===''||!Number.isFinite(Number(value))||!period||!evidenceValid(ref,source,date))return toast('القيمة والفترة ومرجع الدليل ومصدره وتاريخه مطلوبة');db.indicatorReadings.push({id:id('VAL'),indicatorId:iid,period,value:Number(value),numerator:v('mrNum'),denominator:v('mrDen'),evidenceRef:ref,evidenceSource:source,evidenceDate:date,limitations:v('mrLimit'),status:'بانتظار مراجعة رئيس القسم',created:now()});persist();render();toast('تم إرسال قياس المؤشر للمراجعة')}
function verifyReading(rid,accept){let m=db.indicatorReadings.find(x=>x.id===rid),ind=db.indicators.find(x=>x.id===m?.indicatorId);if(!ind||!mayVerify(ind.dept||DEPT_HUM)||m.status!=='بانتظار مراجعة رئيس القسم')return toast('غير مسموح');let reason=prompt('ملاحظة المراجعة أو سبب الإعادة:')||'';if(!accept&&!reason)return toast('سبب الإعادة مطلوب');m.status=accept?'تم التحقق':'معاد للاستكمال';m.reviewNote=reason;m.reviewedAt=now();persist();render()}

function measurementsPage(){const inds=db.indicators.filter(i=>ownsDepartment(i.dept||DEPT_HUM));let q=db.indicatorReadings.filter(x=>{let i=db.indicators.find(z=>z.id===x.indicatorId);return i&&mayVerify(i.dept||DEPT_HUM)&&x.status==='بانتظار مراجعة رئيس القسم'});return `<h1 class="h1">مؤشرات الدائرة والقياسات الدورية</h1><p class="lead">يفصل النظام بين إنشاء تعريف المؤشر بواسطة مدير الدائرة، وإدخال قيمه مع دليل لكل فترة، والتحقق الفني من الحساب والمصدر، وتحليل النتائج مقارنة بخط الأساس والمستهدف.</p>${R().type==='director'?panel('تعريف مؤشر جديد',`<div class="grid">${field('miName','اسم المؤشر *')}${field('miClass','نوعه',selectHtml('miClass',[['حضري','حضري'],['تشغيلي للخطة','تشغيلي للخطة'],['مساهمة مشروع','مساهمة مشروع']]))}${field('miDept','القسم المعني',selectHtml('miDept',[[DEPT_HUM,DEPT_HUM],[DEPT_POL,DEPT_POL]]))}${field('miFormula','تعريف المؤشر وطريقة حسابه *')}${field('miUnit','وحدة القياس *')}${field('miFrequency','دورية القياس *',selectHtml('miFrequency',[['شهري','شهري'],['ربع سنوي','ربع سنوي'],['نصف سنوي','نصف سنوي'],['سنوي','سنوي'],['وفق حدث','وفق حدث']]))}${field('miSource','مصدر البيانات والجهة المالكة *')}${field('miPurpose','النتيجة المراد قياسها')}${field('miBaseline','خط الأساس والفترة')}${field('miBaselineEvidence','مرجع دليل خط الأساس')}${field('miTarget','المستهدف والفترة')}${field('miTargetEvidence','مرجع إقرار المستهدف')}</div>${btn('حفظ بطاقة المؤشر','registerIndicator()','primary')}`):''}
${panel('سجل المؤشرات المعتمدة للعرض',table(['المؤشر','النوع','القسم','الوحدة / الدورية','خط الأساس','المستهدف','القياسات'],inds.map(i=>[`<b>${esc(i.name)}</b><br><span class="tiny muted">${esc(i.formula)}</span>`,esc(i.classification||'غير مصنف'),esc(i.dept||DEPT_HUM),esc(i.unit||'—')+' / '+esc(i.frequency||'—'),esc(i.baseline||'غير متوفر'),esc(i.target||'غير متوفر'),btn('عرض القياسات',`indicatorSelected='${i.id}';render()`)])))}

function verifySpace(aid,accept){let x=db.spaceAssessments.find(x=>x.id===aid);if(!x||!mayVerify(DEPT_HUM))return toast('لا يسمح الدور');let reason=prompt('ملاحظات التحقق أو سبب الإعادة:')||'';if(!accept&&!reason)return toast('سبب الإعادة مطلوب');x.status=accept?'تم التحقق':'معاد للاستكمال';x.reviewNote=reason;persist();render()}
const gisLayers=[['الحدود الإدارية','الولاية / الأحياء','مرجع نطاق الحصر'],['الفضاءات العامة','مضلعات وحدود الموقع','هوية مكانية واحدة لكل فضاء'],['تصنيف الاستعمال','حدائق، ميادين، مماشٍ، شواطئ، ساحات، متنفسات','تحليل الفئات'],['المداخل والمرافق','نقاط الوصول والمرافق والخدمات','تقييم الإتاحة'],['شبكة الطرق والمشاة','المعابر والمحطات والاتصال','تحليل الوصول'],['السكان ومناطق الخدمة','توزيع السكان أو نطاقات المشي','تقييم العدالة في التوزيع'],['الغطاء الأخضر والظل','الأشجار ومساحات الظل','تقييم الراحة والاستدامة'],['الحالة والسلامة','زيارات التقييم وسلامة المرافق','متابعة الحالة عبر الزمن'],['المشروعات والتدخلات','مشروعات الجهات وتوصيات التحسين','مراقبة العلاقة بالمواقع'],['البيانات البيئية','المناطق الطبيعية والهواء والمياه عند توفرها','تقييم الاستدامة']];
function gisPage(){const assessments=db.spaceAssessments.filter(x=>ownsDepartment(DEPT_HUM));return `<h1 class="h1">الفضاءات العامة والسجل المكاني</h1><p class="lead">سجل موحد لكل فضاء عام في الولاية، مع طبقات GIS، وحالة موثقة تتغير بتغير الزمن. لا يُعرض حصر كامل أو خريطة بحدود غير مثبتة قبل استيراد بيانات البلدية الرسمية والتحقق منها.</p>${panel('مواصفات طبقات GIS',table(['الطبقة','النطاق أو البيانات','الغرض'],gisLayers.map(x=>x.map(esc))))}${panel('المواقع المرجعية والحصر',table(['الفضاء','النوع','الولاية','مرجع GIS','حالة التحقق'],db.gis.map(x=>[esc(x.name),esc(x.type),esc(x.wilaya),esc(x.geometry||'غير متوفر'),badge(x.status)])))}${mayUpdate(DEPT_HUM)?panel('تسجيل موقع مرجعي جديد',`<div class="grid">${field('siteName','اسم الفضاء *')}${field('siteType','نوع الفضاء')}${field('siteWilaya','الولاية *')}${field('siteGeom','معرف/مرجع طبقة GIS')}</div>${btn('حفظ للحصر والتحقق','addSite()','primary')}`):''}
${panel('تقييم حالة الفضاءات عبر الزمن',table(['الموقع','الفترة','الحالة','الوصول','الظل','الدليل','التحقق'],assessments.map(x=>[esc(x.site),esc(x.period),esc(x.condition),esc(x.access||'—'),esc(x.shade||'—'),evidenceLabel(x),badge(x.status)])))}${mayUpdate(DEPT_HUM)?panel('تقييم حالة موقع',`<div class="grid">${field('saSite','الموقع *',selectHtml('saSite',db.gis.map(x=>[x.name,x.name])))}${field('saRef','مرجع GIS')}${field('saPeriod','فترة التقييم *','type="month"')}${field('saCondition','حالة الموقع *',selectHtml('saCondition',[['جيدة','جيدة'],['متوسطة','متوسطة'],['بحاجة لتحسين','بحاجة لتحسين'],['تتطلب تحققًا ميدانيًا','تتطلب تحققًا ميدانيًا']]))}${field('saAccess','إتاحة الوصول')}${field('saSafety','السلامة')}${field('saShade','الظل والراحة')}${field('saFacilities','حالة المرافق')}${field('saAction','التوصية أو التدخل المقترح')}${field('saEvidence','مرجع دليل التقييم *')}${field('saSource','المصدر/جهة التقييم *')}${field('saDate','تاريخ الدليل *','type="date"')}</div>${btn('تسجيل تقييم للمراجعة','saveSpaceAssessment()','primary')}`):''}${mayVerify(DEPT_HUM)?panel('مراجعة تقييمات المواقع',table(['الموقع','الفترة','التقييم','القرار'],db.spaceAssessments.filter(x=>x.status==='بانتظار مراجعة رئيس القسم').map(x=>[esc(x.site),esc(x.period),esc(x.condition),btn('تحقق',`verifySpace('${x.id}',true)`,'primary')+' '+btn('إعادة',`verifySpace('${x.id}',false)`,'warn')]))):''}${rowNotice('اتصال GIS المباشر واستيراد كامل طبقات الولاية غير منفذ في النموذج المحلي. لا تُفسَّر بيانات الحصر الأولية على أنها طبقات معتمدة.')}`}
// Distinguish source directory, published article, extracted opportunity; no automated harvesting.
function registerExternalMaterial(){if(R().type!=='employee')return toast('الحفظ للموظف المختص');if(!v('oiTitle')||!v('oiUrl')||!v('oiDate'))return toast('العنوان والرابط وتاريخ النشر مطلوب');db.sourceArticles.push({id:id('ART'),source:v('oiSource'),title:v('oiTitle'),url:v('oiUrl'),published:v('oiDate'),topic:v('oiTopic'),summary:v('oiSummary'),recordedAt:now()});persist();render()}
function observPage(){return `<h1 class="h1">المرصد الحضري — المستجدات الخارجية</h1><p class="lead">متاح لجميع الأدوار لمتابعة التطورات في التخطيط الحضري والأنسنة والتنقل والبيئة. المصدر موقع معتمد؛ المادة خبر أو دراسة منشورة فيه؛ والفكرة فرصة محلية تُستخلص بعد القراءة والتقييم. المقترحات الداخلية تسجل في سجل الموضوعات.</p><div class="grid3"><div class="small-card"><span class="kicker">1 · المصدر</span><h3>الموقع الإلكتروني</h3><p>مصادر معتمدة يحددها مدير الدائرة بالتنسيق مع القسمين</p></div><div class="small-card"><span class="kicker">2 · المادة المنشورة</span><h3>دراسة أو خبر أو تجربة</h3><p>عنوان ورابط وتاريخ وملخص ومجال الاهتمام</p></div><div class="small-card"><span class="kicker">3 · الفكرة المستخلصة</span><h3>فرصة تستحق الدراسة</h3><p>مبررات الملاءمة لظفار وتحويل اختياري إلى مقترح</p></div></div>${panel('قائمة مصادر مختارة',table(['المصدر','المجال','الرابط'],sources.map(s=>[esc(s[0]),esc(s[2]),`<a href="${s[1]}" target="_blank" rel="noopener">فتح الموقع</a>`])))}
${panel('المواد الخارجية الموثقة',table(['المصدر','المادة','النشر','المجال','الرابط'],db.sourceArticles.map(x=>[esc(x.source),esc(x.title),esc(x.published),esc(x.topic),`<a href="${esc(x.url)}" target="_blank" rel="noopener">فتح المادة</a>`])))}
${R().type==='employee'?panel('تسجيل مادة منشورة في مصدر معتمد',`<div class="grid">${field('oiSource','المصدر',selectHtml('oiSource',sources.map(s=>[s[0],s[0]])))}${field('oiTitle','عنوان المادة *')}${field('oiUrl','رابط المادة *','type="url"')}${field('oiDate','تاريخ النشر *','type="date"')}${field('oiTopic','الموضوع أو المجال')}${field('oiSummary','ملخص المادة','<textarea id="oiSummary" rows="2"></textarea>')}</div>${btn('حفظ مادة بالمرصد','registerExternalMaterial()','primary')}`):''}
${panel('الأفكار المستخلصة',table(['الفكرة','المادة المرجعية','المصدر','ملاءمة محلية'],db.externalIdeas.map(x=>[esc(x.idea),esc(x.article),esc(x.source),esc(x.relevance)])))}${R().type==='employee'?panel('تسجيل فرصة من المادة',`<div class="grid">${field('obsSource','المصدر',selectHtml('obsSource',sources.map(s=>[s[0],s[0]])))}${field('obsArticle','عنوان المادة المنشورة *')}${field('obsUrl','رابط المادة *','type="url"')}${field('obsIdea','الفكرة المستخلصة *')}${field('obsRelevance','مبررات الملاءمة لظفار')}</div>${btn('حفظ الفكرة للمراجعة','addExternalIdea()','primary')}`):''}${rowNotice('عرض آخر الأخبار والبحث الشامل في مواقع الإنترنت يحتاج خدمات مصادر RSS أو APIs أو فهرسة مصرحًا بها. هذه النسخة لا تزعم جلب محتوى مباشر ولا تستخدم AI.')}`}
function archPage(){return `<h1 class="h1">الهيكلة التنظيمية والمعمارية للمنصة</h1><p class="lead">التنظيم الإداري يحدد الصلاحية؛ العملية تحدد مسار العمل؛ السجل يحفظ المعلومات؛ الواجهة تجمع الأعمال ذات الصلة دون تكرارها.</p>${panel('الهيكل الإداري',`<div class="flow"><div class="flowbox"><b>مدير دائرة التنمية الحضرية</b><p class="tiny muted">الخطة السنوية والمؤشرات والتوجيه والاعتماد وإدارة القسمين</p></div><div class="arrow">↓</div><div class="grid" style="width:100%"><div class="flowbox"><b>رئيس قسم أنسنة المدن</b><p class="tiny muted">مراجعة أعمال الفضاءات العامة والنقل والبيئة والرفاه</p></div><div class="flowbox"><b>رئيس قسم السياسات والدراسات الحضرية</b><p class="tiny muted">الدراسات والتحليل والسياسات والمعايير</p></div></div><div class="grid" style="width:100%"><div class="flowbox">الموظفون المختصون — أنسنة المدن</div><div class="flowbox">الموظفون المختصون — السياسات</div></div></div>`)}
${panel('سجلات مرجعية واحدة وواجهات متعددة',table(['الكيان','مالك بياناته','العلاقات'],[['الموضوع / المعاملة','الدائرة المعنية بالمعالجة','دراسة، تنسيق، مخرجات، قرار، تعلم'],['مشروع دائرة أخرى','الدائرة المالكة للبيانات التنفيذية','متابعة حضرية وأهداف ومؤشرات دون إدارة التنفيذ'],['الفضاء العام','المصدر المكاني المخول','طبقات GIS وتقييمات حالة ومشروعات وملاحظات'],['المؤشر','مدير الدائرة يقر تعريفه','خط أساس ومستهدف وقراءات دورية وأدلة'],['بند الخطة','مدير الدائرة','تكليفات وتحديثات وإنجاز وأدلة وإصدارات'],['الدليل','الجهة أو المستخدم الذي قدمه','يُربط بالمخرج أو القياس مع المصدر والتاريخ'],['الدرس','منشؤه في الملف','توصية تحسين ومسؤول ونتيجة تطبيق']].map(x=>x.map(esc))))}
${panel('متطلبات الأمان والتشغيل الحقيقي',`<div class="grid3">${['صلاحيات الخادم وفق الدور والقسم والتفويض','مصادقة الهوية المؤسسية وإدارة المستخدمين','قاعدة بيانات مشتركة بإصدارات وسجل تدقيق','مستودع أدلة ومرفقات محمي','توليد ملفات PDF وXLSX أصلية بخادم','تكامل GIS بالطبقات الرسمية وصلاحيات تحريرها','جلب المصادر الخارجية وفق القنوات المسموحة','اختبار قبول المستخدم والتحقق من الانتقالات','إمكانية وصول RTL وWCAG 2.1 AA'].map(x=>`<div class="small-card">${x}</div>`).join('')}</div>`)}`}
function rolesPage(){return `<h1 class="h1">الصلاحيات — حسب الدور والقسم والحالة</h1><p class="lead">ثلاثة مستويات إدارية. نطاق رئيس القسم والموظف محصور بالقسم والتكليف. مدير الدائرة يضع ويُدير الخطة والمؤشرات ويتابع أداء القسمين ويعتمد ضمن تفويضه.</p>${panel('مصفوفة صلاحيات عملية',table(['العمل','الموظف المختص','رئيس القسم','مدير الدائرة'],[['تسجيل مقترح أو طلب من جهة','إنشاء بملفات قسمه','إشراف وتوجيه','توجيه على مستوى الدائرة'],['الدراسة والتحليل','إعداد ومرفقات','مراجعة فنية','مراجعة استراتيجية'],['اعتماد مخرجات القسم','لا','توصية ورفع','اعتماد ضمن التفويض'],['إنشاء الخطة ومؤشراتها','لا','مدخلات القسم','إنشاء وإدارة'],['تحديث إنجاز بند الخطة','تحديث موثق لكل فترة','مراجعة وتحقق','متابعة الانحراف واتخاذ قرار'],['تعريف مؤشرات الدائرة','لا','مقترح فني','إنشاء وإقرار'],['قيمة المؤشر الدورية','تسجيل مع دليل','تحقق حسابي وفني','تقييم نتائج'],['تقييم الفضاءات العامة','تسجيل تقييم بدليل','تحقق ومراجعة','متابعة الأولويات والتوجيه'],['المرصد الخارجي','اطلاع وحفظ مادة وفكرة','اطلاع ومراجعة فنية','اطلاع وتوجيه'],['سجل التعلم','تسجيل مرتبط بملف','مراجعة','متابعة إجراءات التحسين'],['التقارير والتصدير','نطاق تكليفه','نطاق قسمه','نطاق الدائرة']].map(x=>x.map(esc))))}<div class="warning">تبديل الدور هنا للمعاينة فقط. لا يمثّل تحقق هوية أو صلاحيات إنتاجية؛ يجب فرض الصلاحيات في الخادم والاستعلامات والملفات وليس في إظهار الأزرار فحسب.</div>`}
function dashPage(){let visible=db.cases.filter(inScope),plans=scopedPlans(),pending=db.planUpdates.filter(x=>{let p=db.annual.find(z=>z.id===x.planId);return p&&ownsDepartment(p.dept)&&x.status==='بانتظار مراجعة رئيس القسم'});let readings=scopedReads();let approved=readings.filter(x=>x.status==='تم التحقق');let validCases=visible.filter(x=>x.status==='بانتظار قرار المدير');let metricStats=[['ملفات العمل في نطاقك',visible.length,'وفق صلاحية القسم'],['قرارات تنتظر المدير',R().type==='director'?validCases.length:visible.filter(x=>x.status==='قيد المراجعة').length,'الأولوية حسب الدور'],['تحديثات إنجاز للمراجعة',pending.length,'أدلة لم تُراجع بعد'],['قراءات مؤشر متحقق منها',approved.length,'قيم دورية موثقة']];return `<h1 class="h1">لوحة معلومات ${R().type==='director'?'الدائرة':R().type==='head'?'القسم':'الأعمال المكلف بها'}</h1><p class="lead">معلومات من السجلات المخزنة في هذا المتصفح، مع الفصل بين البيانات المدخلة والبيانات التي جرى التحقق منها. لا تُعرض أرقام توضيحية على أنها أداء فعلي.</p><div class="metrics">${metricStats.map(x=>miniMetric(x[0],x[2],x[1])).join('')}</div><div class="grid">${panel('العمل الذي يحتاج إجراء',visible.filter(x=>R().type==='director'?x.status==='بانتظار قرار المدير':R().type==='head'?x.status==='قيد المراجعة':x.status==='قيد المعالجة الفنية').slice(0,8).map(x=>`<div class="trace-item"><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.id)} · ${esc(x.status)}</div>${btn('فتح الملف',`openCase('${x.id}')`)}</div>`).join('')||'<div class="empty">لا توجد ملفات مستحقة للمراجعة في نطاقك</div>')}${panel('تقدم بنود الخطة الموثق',plans.length?plans.map(p=>`<div class="trace-item"><div class="inline"><b>${esc(p.title)}</b><span class="tiny muted">${esc(p.dept)}</span></div>${latestApprovedProgress(p.id)===null?'<div class="tiny muted">لا توجد نسبة متحقق منها حتى الآن</div>':`<div class="stat-row"><strong>${latestApprovedProgress(p.id)}%</strong><span class="muted tiny">وفق آخر تحديث تمت مراجعته</span></div>${percentBar(latestApprovedProgress(p.id))}`}</div>`).join(''):'<div class="empty">لم تُنشأ بنود الخطة بعد</div>')}</div>${panel('أعمال نظامية مشتركة',`<div class="grid3">${[['plan','الخطة السنوية'],['measurements','القياسات والأدلة'],['gis','الفضاءات العامة'],['observatory','المرصد الخارجي'],['learning','التعلم المؤسسي'],['reports','التقارير']].map(x=>`<button class="cardsel" onclick="navigate('${x[0]}')">${x[1]}　↖</button>`).join('')}</div>`)}<div class="warning tiny">هذه لوحة تحليل واختبار. لا تستخدم بيانات واقعية أو حسابات أداء رسمية قبل الربط المؤسسي والتحقق.</div>`}
function homePage(){let r=R(),v=db.cases.filter(inScope),action=v.filter(x=>r.type==='director'?x.status==='بانتظار قرار المدير':r.type==='head'?x.status==='قيد المراجعة':x.status==='قيد المعالجة الفنية');return `<section class="banner"><span class="kicker">دائرة التنمية الحضرية · بلدية ظفار</span><h1 class="h1">مرحبًا في مساحة عمل ${esc(r.name)}</h1><p class="section-intro">${r.type==='director'?'توجيه أعمال الدائرة ومراجعة القسمين وإدارة الخطة والمؤشرات وقرارات الاعتماد.':r.type==='head'?'تنظيم أعمال القسم ومراجعة الدراسات والأدلة والتوصيات ومتابعة التنفيذ.':'تسجيل المقترحات ومعالجة ملفات القسم، وإعداد المخرجات وتحديث الإنجاز والقياسات مع أدلتها.'}</p><div class="actions">${r.type==='employee'?btn('تسجيل موضوع أو مقترح',"navigate('new')",'primary'):r.type==='director'?btn('الخطة السنوية',"navigate('plan')",'primary'):btn('ملفات القسم',"navigate('cases')",'primary')}${btn('لوحة المعلومات',"navigate('dashboard')")}${btn('المرصد الحضري',"navigate('observatory')")}</div></section><div class="metrics">${miniMetric('ملفات العمل', 'نطاق الدور',v.length)}${miniMetric('تحتاج إجراء','وفق مرحلة العمل',action.length)}${miniMetric('بنود الخطة','نطاق القسم',scopedPlans().length)}${miniMetric('دروس مؤسسية','موجودة في السجل',db.lessons.filter(l=>r.type==='director'||v.some(x=>x.id===l.caseId)).length)}</div><div class="grid">${panel('أولوياتك',action.length?action.slice(0,6).map(x=>`<div class="trace-item"><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.status)} · ${esc(x.id)}</div>${btn('فتح',`openCase('${x.id}')`)}</div>`).join(''):'<div class="empty">لا توجد أعمال تستلزم إجراءً الآن</div>')}${panel('مسارات العمل',`<div class="grid">${[['cases','المقترحات والملفات'],['specializations','الدراسات والسياسات'],['projects','متابعة المشروعات'],['gis','الفضاءات وGIS'],['observatory','المرصد الخارجي']].map(x=>`<button class="cardsel" onclick="navigate('${x[0]}')">${x[1]}　↖</button>`).join('')}</div>`)}</div>${rowNotice('الشاشة الرئيسية مخصصة للعمل اليومي؛ لوحة المعلومات للقياس والمتابعة؛ خريطة العمليات للمنهجيات. البيانات المخزنة محليًا تجريبية وليست سجلات البلدية.')}`}
function reportsPage(){return `<h1 class="h1">التقارير ومرجع الأدلة</h1><p class="lead">استخرج سجلات المعاملات والخطة والمؤشرات وقياساتها والأدلة والتعلم ضمن حدود الدور. الطباعة تتيح حفظ PDF؛ وCSV قابل للفتح في Excel. لإنشاء XLSX وPDF أصليين يلزم مكوّن إنتاجي.</p><div class="actions">${btn('المعاملات CSV',"exportCSV('cases')",'primary')}${btn('الخطة CSV',"exportCSV('annual')")}${btn('تحديثات الإنجاز CSV',"exportCSV('planUpdates')")}${btn('المؤشرات CSV',"exportCSV('indicators')")}${btn('قيم المؤشرات CSV',"exportCSV('indicatorReadings')")}${btn('تقييمات المواقع CSV',"exportCSV('spaceAssessments')")}${btn('التعلم CSV',"exportCSV('lessons')")}${btn('طباعة / PDF','window.print()','dark')}</div>${panel('حالة الأدلة',table(['المجال','المقدم','المتحقق','قيد المراجعة'],[['إنجازات الخطة',db.planUpdates,db.planUpdates.filter(x=>x.status==='تم التحقق'),db.planUpdates.filter(x=>x.status==='بانتظار مراجعة رئيس القسم')],['قياسات المؤشرات',db.indicatorReadings,db.indicatorReadings.filter(x=>x.status==='تم التحقق'),db.indicatorReadings.filter(x=>x.status==='بانتظار مراجعة رئيس القسم')],['تقييمات المواقع',db.spaceAssessments,db.spaceAssessments.filter(x=>x.status==='تم التحقق'),db.spaceAssessments.filter(x=>x.status==='بانتظار مراجعة رئيس القسم')]].map(x=>[esc(x[0]),String(x[1].length),String(x[2].length),String(x[3].length)])))}${rowNotice('مرجع الدليل في هذا النموذج نص موثق؛ لا يوجد رفع ملفات حقيقي أو مستودع أدلة مؤسسي. لا تعتبر هذه الواجهة إثباتًا قانونيًا أو نظام أرشفة رسميًا.')}`}
const oldExportCSV=exportCSV;exportCSV=function(group){let rows=db[group]||[];if(group==='cases')rows=rows.filter(inScope);else if(group==='annual')rows=rows.filter(p=>ownsDepartment(p.dept));else if(group==='planUpdates')rows=rows.filter(u=>{let p=db.annual.find(x=>x.id===u.planId);return p&&ownsDepartment(p.dept)});else if(group==='indicators')rows=rows.filter(i=>ownsDepartment(i.dept||DEPT_HUM));else if(group==='indicatorReadings')rows=scopedReads();else if(group==='spaceAssessments')rows=rows.filter(x=>ownsDepartment(DEPT_HUM));else if(group==='lessons'&&R().type!=='director'){let a=db.cases.filter(inScope).map(x=>x.id);rows=rows.filter(x=>a.includes(x.caseId))}downloadCSV(rows,group+'-dhofar.csv')};

// Project reference / urban contribution register: do not model execution ownership.
if(!Array.isArray(db.projects))db.projects=[];
if(!Array.isArray(db.projectUpdates))db.projectUpdates=[];
if(!Array.isArray(db.projectLearning))db.projectLearning=[];
let projectSelected=null;
function addProject(){if(R().type!=='employee')return toast('يسجل الموظف المختص مشروع المتابعة ضمن قسمه');let name=v('pjName'),owner=v('pjOwner'),scope=v('pjScope'),purpose=v('pjPurpose'),docs=v('pjDocs');if(!name||!owner||!scope||!purpose||!docs)return toast('اسم المشروع والدائرة المالكة والنطاق والهدف ومرجع الوثيقة مطلوبة');db.projects.push({id:id('PRJ'),name,owner,refNo:v('pjRef'),sender:v('pjSender')||owner,scope,purpose,docs,location:v('pjLocation'),start:v('pjStart'),end:v('pjEnd'),beneficiaries:v('pjBeneficiaries'),dept:R().dept,status:'بيانات مرجعية أولية',goal:'',results:'',indicator:'',baseline:'',target:'',dataOwner:'',frequency:'',method:'',planVerified:false,created:now()});persist();render();toast('سجل مشروع مرجعي للمتابعة، لا يعني اعتماد التنفيذ')}
function addProjectPlan(pid){let x=db.projects.find(z=>z.id===pid);if(!x||!mayUpdate(x.dept))return toast('غير مصرح');let goal=v('ppGoal'),results=v('ppResults'),indicator=v('ppIndicator'),source=v('ppSource');if(!goal||!results||!indicator||!source)return toast('الهدف والنتائج والمؤشر ومصدر البيانات مطلوبة');Object.assign(x,{goal,results,indicator,baseline:v('ppBaseline'),target:v('ppTarget'),dataOwner:source,frequency:v('ppFrequency'),method:v('ppMethod'),status:'خطة متابعة قيد المراجعة',planVerified:false});persist();render()}
function verifyProjectPlan(pid,accept){let x=db.projects.find(z=>z.id===pid);if(!x||!mayVerify(x.dept))return toast('غير مصرح');x.status=accept?'خطة متابعة مراجعة':'تحتاج استكمال خطة المتابعة';x.planVerified=!!accept;persist();render()}
function addProjectUpdate(pid){let x=db.projects.find(z=>z.id===pid);if(!x||!mayUpdate(x.dept))return toast('غير مصرح');let period=v('ptPeriod'),value=v('ptValue'),ref=v('ptEvidence'),src=v('ptSource'),date=v('ptDate');if(!period||!value||!evidenceValid(ref,src,date))return toast('الفترة والنتيجة والدليل ومصدره وتاريخه مطلوبة');db.projectUpdates.push({id:id('PRU'),projectId:pid,period,reportedExecution:v('ptExecution'),outcome:value,interpretation:v('ptAnalysis'),evidenceRef:ref,evidenceSource:src,evidenceDate:date,status:'بانتظار مراجعة رئيس القسم',created:now()});persist();render()}
function verifyProjectUpdate(uid,accept){let u=db.projectUpdates.find(x=>x.id===uid),p=db.projects.find(x=>x.id===u?.projectId);if(!p||!mayVerify(p.dept))return toast('غير مصرح');u.status=accept?'تم التحقق':'معاد للاستكمال';persist();render()}
function addProjectLearning(pid){let x=db.projects.find(z=>z.id===pid);if(!x||!mayUpdate(x.dept))return toast('غير مصرح');let obs=v('prObs'),lesson=v('prLesson'),action=v('prAction');if(!obs||!lesson)return toast('الملاحظة والدرس مطلوبان');db.projectLearning.push({id:id('PRL'),projectId:pid,observation:obs,lesson,action,created:now(),status:'مسجل'});persist();render()}
function projectsPage(){let list=db.projects.filter(x=>ownsDepartment(x.dept));return `<h1 class="h1">متابعة المساهمة الحضرية للمشروعات</h1><p class="lead">هذا سجل لمشروعات تنفذها دوائر أخرى؛ دائرة التنمية الحضرية تملك ملف المتابعة وتقييم المساهمة فقط. لا تعني نسبة التنفيذ المبلّغ عنها تحقق النتائج الحضرية.</p>${panel('الدورة التفصيلية والمخرجات',table(['مرحلة','مدخلات','مخرجات'],[['تسجيل المشروع','المرجع والدائرة المالكة والموقع والملف والمخططات','بطاقة موثقة وبيان النواقص'],['ارتباط الأهداف','الأهداف وبيانات المشروع والمستفيدون والنطاق','مصفوفة ارتباط ونتائج متوقعة'],['خطة المتابعة والتقييم','المؤشر وخط الأساس والمستهدف ومصدر البيانات والدورية','خطة قياس وتحديد المسؤوليات'],['استلام التقدم','تقرير الجهة المالكة والنتائج والأدلة والفترات','سجل تقدم قابل للتحقق'],['التقييم والتعلم','القيم المراجعة والتحليل والملاحظات','تقييم مساهمة وتوصيات ودروس']].map(x=>x.map(esc))))}
${mayUpdate(R().dept)?panel('تسجيل مشروع للمتابعة الحضرية',`<div class="grid">${field('pjName','اسم المشروع *')}${field('pjOwner','اسم الدائرة المالكة والمنفذة *')}${field('pjSender','الدائرة المحيلة إن اختلفت')}${field('pjRef','الرقم المرجعي/الخطاب')}${field('pjLocation','الموقع أو نطاق التأثير')}${field('pjScope','وصف نطاق المشروع *')}${field('pjPurpose','الأهداف والنتائج المتوقعة *')}${field('pjBeneficiaries','الفئات المستفيدة')}${field('pjStart','تاريخ بدء التنفيذ المبلّغ إن توفر','type="date"')}${field('pjEnd','تاريخ النهاية المتوقع إن توفر','type="date"')}${field('pjDocs','مرجع PDF والمخططات وإصداراتها *')}</div>${btn('إنشاء سجل متابعة مرجعي','addProject()','primary')}`):''}
${panel('سجل مشروعات المتابعة',table(['المرجع','المشروع','الدائرة المالكة','القسم المتابع','حالة متابعة الملف','فتح'],list.map(x=>[esc(x.id),esc(x.name),esc(x.owner),esc(x.dept),badge(x.status),btn('عرض الملف',`projectSelected='${x.id}';render()`)])))}
${projectSelected&&list.some(x=>x.id===projectSelected)?projectDetail(projectSelected):''}<div class="note tiny">لا يتم جمع تقدم التنفيذ إلا من جهة مالكة أو مصدر موثق. قياس النتائج الحضرية منفصل عن الإنجاز التشغيلي. اعتماد خطة المتابعة في هذا النموذج مراجعة داخل القسم، والاعتماد الإداري النهائي وفق التفويض.</div>`}
function projectDetail(pid){let p=db.projects.find(x=>x.id===pid),updates=db.projectUpdates.filter(x=>x.projectId===pid),lessons=db.projectLearning.filter(x=>x.projectId===pid);return panel('ملف متابعة: '+esc(p.name),`<div class="actions">${btn('إغلاق تفاصيل الملف','projectSelected=null;render()')}</div><div class="grid3"><div class="small-card"><b>الجهة المالكة للتنفيذ</b><p>${esc(p.owner)}</p></div><div class="small-card"><b>النطاق والملف</b><p>${esc(p.scope)}</p><p class="tiny muted">${esc(p.docs)}</p></div><div class="small-card"><b>هدف المشروع</b><p>${esc(p.purpose)}</p></div></div><h4>ربط المشروع بالأهداف وخطة المتابعة</h4>${mayUpdate(p.dept)?`<div class="grid">${field('ppGoal','الهدف الحضري المرتبط *',`<input id="ppGoal" value="${esc(p.goal)}">`)}${field('ppResults','النتيجة الحضرية المتوقعة *',`<input id="ppResults" value="${esc(p.results)}">`)}${field('ppIndicator','المؤشر وطريقة القياس *',`<input id="ppIndicator" value="${esc(p.indicator)}">`)}${field('ppBaseline','خط الأساس ودليله',`<input id="ppBaseline" value="${esc(p.baseline)}">`)}${field('ppTarget','المستهدف والفترة',`<input id="ppTarget" value="${esc(p.target)}">`)}${field('ppSource','الجهة المالكة لبيانات القياس *',`<input id="ppSource" value="${esc(p.dataOwner)}">`)}${field('ppFrequency','دورية القياس',`<input id="ppFrequency" value="${esc(p.frequency)}">`)}${field('ppMethod','التحقق ومنهجية التقييم',`<input id="ppMethod" value="${esc(p.method)}">`)}</div>${btn('إرسال خطة المتابعة للمراجعة',`addProjectPlan('${pid}')`,'primary')}`:table(['الهدف','النتيجة','المؤشر','المصدر','الدورية'],[[esc(p.goal),esc(p.results),esc(p.indicator),esc(p.dataOwner),esc(p.frequency)]])}${mayVerify(p.dept)&&p.status==='خطة متابعة قيد المراجعة'?`<div class="actions">${btn('التحقق من خطة المتابعة',`verifyProjectPlan('${pid}',true)`,'primary')}${btn('طلب استكمال',`verifyProjectPlan('${pid}',false)`,'warn')}</div>`:''}
<h4>بيانات التقدم والنتائج</h4>${mayUpdate(p.dept)?`<div class="grid">${field('ptPeriod','فترة المتابعة *','type="month"')}${field('ptExecution','تقدم التنفيذ وفق تقرير الدائرة المالكة')}${field('ptValue','النتيجة أو قيمة القياس الحضرية *')}${field('ptAnalysis','التحليل وحدود إسناد النتيجة للمشروع')}${field('ptEvidence','مرجع الدليل *')}${field('ptSource','مصدر الدليل *')}${field('ptDate','تاريخ الدليل *','type="date"')}</div>${btn('تسجيل تحديث موثق',`addProjectUpdate('${pid}')`,'primary')}`:''}${table(['الفترة','تقدم التنفيذ المبلّغ','النتيجة الحضرية','الدليل','الحالة','القرار'],updates.map(u=>[esc(u.period),esc(u.reportedExecution||'غير متوفر'),esc(u.outcome),evidenceLabel(u),badge(u.status),mayVerify(p.dept)&&u.status==='بانتظار مراجعة رئيس القسم'?btn('تحقق',`verifyProjectUpdate('${u.id}',true)`,'primary')+' '+btn('إعادة',`verifyProjectUpdate('${u.id}',false)`,'warn'):'—']))}
<h4>سجل التعلم المرتبط بالمشروع</h4>${table(['الملاحظة','الدرس','الإجراء المقترح'],lessons.map(x=>[esc(x.observation),esc(x.lesson),esc(x.action)]))}${mayUpdate(p.dept)?`<div class="grid">${field('prObs','الملاحظة أو التجربة *')}${field('prLesson','الدرس المستفاد *')}${field('prAction','الإجراء التحسيني')}</div>${btn('تسجيل درس للمشروع',`addProjectLearning('${pid}')`,'primary')}`:''}`)}
function learningPage(){let allowed=db.cases.filter(inScope).map(x=>x.id),projectLessons=db.projectLearning.filter(x=>{let p=db.projects.find(z=>z.id===x.projectId);return p&&ownsDepartment(p.dept)});return `<h1 class="h1">سجل التعلم المؤسسي الموحد</h1><p class="lead">تُسجل الدروس في الملف الذي نتجت عنه: معاملة أو دراسة أو مشروع، ثم تجمع في السجل المؤسسي دون إدخال مكرر.</p>${panel('تعلم الإجراءات والدراسات',table(['الملف','الملاحظة','الدرس','الإجراء','الحالة'],db.lessons.filter(x=>R().type==='director'||allowed.includes(x.caseId)).map(x=>[esc(x.caseId),esc(x.observation),esc(x.lesson),esc(x.action),badge(x.status)])))}${panel('تعلم المشروعات',table(['المشروع','الملاحظة','الدرس','التوصية'],projectLessons.map(x=>{let p=db.projects.find(z=>z.id===x.projectId);return [esc(p?.name),esc(x.observation),esc(x.lesson),esc(x.action)]})))}${rowNotice('تطبيق التوصيات وتوثيق نتائجها يحتاج مسؤول متابعة وموعد تحقق وقرار إغلاق ضمن الصلاحيات في النظام الإنتاجي.')}`}

// Render extends the existing process and case workflows without replacing their data.
const previousRender=render;
render=function(){if(['measurements','architecture'].includes(page)){el('content').innerHTML=page==='measurements'?measurementsPage():archPage();return;}previousRender()};
// Update case study enforcement: when submitted, a source/reference must be recorded alongside evidence narrative.
const oldSubmitStudy=submitStudy;
submitStudy=function(cid){let x=db.cases.find(c=>c.id===cid);if(x&&!((x.evidence||'').trim()))return toast('لا يمكن إرسال الدراسة للمراجعة دون وصف الأدلة والمصادر والفجوات');return oldSubmitStudy(cid)};
// Save local data structure upgrades.
persist();

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>navigate(b.dataset.page));el('roleSelect').onchange=e=>{role=e.target.value;selected=null;filter='all';render()};render();
</script></body></html>
